# Cases of the secrets plugins (gosecrets, luasecrets, tssecrets), whose Coupon sends the secret coupon_token to the
# coupon service: the first two pass, the last two fail.
httpPolicy:
  allowedHosts: [coupons.example.com]
cases:
  - name: the faked token reaches the coupon service
    call: Coupon
    input: {code: SAVE10}
    secrets: {coupon_token: t0k3n}
    http:
      - url: https://coupons.example.com/codes/SAVE10?token=t0k3n
        body: "10"
        times: 1
    expect:
      result: 10

  - name: a read faked as failing is the plugin's error
    call: Coupon
    input: {code: SAVE10}
    secrets: {coupon_token: null}
    expect:
      error: secret "coupon_token" could not be resolved

  - name: a read the case does not fake fails it
    call: Coupon
    input: {code: SAVE10}
    expect:
      result: 10

  - name: a fake plugin.yaml does not declare fails the case
    call: Coupon
    input: {code: SAVE10}
    secrets: {coupon_token: t0k3n, api_key: k3y}
    expect:
      result: 10
