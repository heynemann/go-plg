name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.3
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  check:
    name: gates (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - name: golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
      # The Go guest compiles cold in a few seconds; caching the default compilation cache keeps test runs warm.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/plg
          key: plg-cache-${{ hashFiles('guest/**/*.wasm*', 'go.sum') }}
      # fmt (no diff), lint (host and wasip1), -race -shuffle=on unit+integration tests, coverage gate, goleak,
      # allocation budgets (uninstrumented), unit tests repeated with -count=10.
      - run: make check

  guests:
    name: guest artifacts are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: make verify-guests

  bench:
    name: benchmarks (recorded, compared with benchstat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: benchmarks on this commit
        run: make bench BENCH_OUT=new.txt
      - name: benchmarks on main
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base origin/main
          make -C ../base bench BENCH_OUT="$PWD/old.txt" || true
      - name: benchstat
        run: |
          if [ -s old.txt ]; then benchstat old.txt new.txt | tee benchstat.txt; else benchstat new.txt | tee benchstat.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            new.txt
            old.txt
            benchstat.txt
          if-no-files-found: ignore
